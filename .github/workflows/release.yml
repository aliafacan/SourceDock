name: Publish Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Match Release Tag to Package Version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(/usr/bin/python3 -c 'from sourcedock.constants import APP_VERSION; print(APP_VERSION)')
          if [ "$RELEASE_TAG" != "v$version" ]; then
            echo "Tag $RELEASE_TAG does not match package version $version."
            exit 1
          fi
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi python3-gi-cairo python3-venv gir1.2-gtk-3.0 gir1.2-gdkpixbuf-2.0 xvfb openbox x11-utils dpkg-dev desktop-file-utils appstream
      - name: Validate and Test
        run: |
          /usr/bin/python3 -m compileall -q main.py sourcedock tests tools
          python3 -m venv /tmp/sourcedock-lint
          /tmp/sourcedock-lint/bin/pip install -r requirements-dev.txt
          /tmp/sourcedock-lint/bin/ruff check .
          bash packaging/build_deb.sh dist
          version=$(/usr/bin/python3 -c 'from sourcedock.constants import APP_VERSION; print(APP_VERSION)')
          SOURCEDOCK_TEST_DEB="$GITHUB_WORKSPACE/dist/sourcedock_${version}_all.deb" \
            xvfb-run -a bash -c 'openbox >/tmp/sourcedock-test-wm.log 2>&1 & wm=$!; trap "kill $wm 2>/dev/null || true" EXIT; /usr/bin/python3 tools/run_tests.py --require-wm'
      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/*.deb dist/*.sha256 --generate-notes --title "SourceDock $RELEASE_TAG"
