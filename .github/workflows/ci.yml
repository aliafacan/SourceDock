name: SourceDock CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: GTK Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-22.04", "ubuntu-24.04"]

    steps:
      - name: Depoyu Klonla (Checkout)
        uses: actions/checkout@v4

      - name: Sistem Bağımlılıklarını Kur
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-gi \
            python3-gi-cairo \
            python3-venv \
            gir1.2-gtk-3.0 \
            gir1.2-gdkpixbuf-2.0 \
            xvfb \
            openbox \
            x11-utils \
            dpkg-dev \
            desktop-file-utils \
            appstream

      - name: Verify System Python and GI
        run: |
          /usr/bin/python3 --version
          /usr/bin/python3 -c "import gi; gi.require_version('Gtk', '3.0'); from gi.repository import Gtk; print(Gtk.MAJOR_VERSION, Gtk.MINOR_VERSION)"

      - name: Lint
        run: |
          python3 -m venv /tmp/sourcedock-lint
          /tmp/sourcedock-lint/bin/pip install -r requirements-dev.txt
          /tmp/sourcedock-lint/bin/ruff check .

      - name: Sözdizimi Kontrolü (Syntax Check)
        run: |
          /usr/bin/python3 -m compileall -q main.py sourcedock tests tools

      - name: Debian (.deb) Paketini Derle ve Doğrula
        run: |
          bash packaging/build_deb.sh dist
          dpkg-deb --info dist/sourcedock_*.deb

      - name: Birim Testleri Çalıştır (Unittest via Xvfb)
        run: |
          version=$(/usr/bin/python3 -c 'from sourcedock.constants import APP_VERSION; print(APP_VERSION)')
          SOURCEDOCK_TEST_DEB="$GITHUB_WORKSPACE/dist/sourcedock_${version}_all.deb" \
            xvfb-run -a bash -c 'openbox >/tmp/sourcedock-test-wm.log 2>&1 & wm=$!; trap "kill $wm 2>/dev/null || true" EXIT; /usr/bin/python3 tools/run_tests.py --require-wm'

      - name: Upload Package
        uses: actions/upload-artifact@v4
        with:
          name: sourcedock-${{ matrix.os }}
          path: |
            dist/*.deb
            dist/*.sha256

