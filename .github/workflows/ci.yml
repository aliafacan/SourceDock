name: VoltApp CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test & Build (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Depoyu Klonla (Checkout)
        uses: actions/checkout@v4

      - name: Sistem Bağımlılıklarını Kur
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-gi \
            python3-gi-cairo \
            gir1.2-gtk-3.0 \
            gir1.2-gdkpixbuf-2.0 \
            xvfb \
            dpkg-dev

      - name: Python ${{ matrix.python-version }} Kur
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Sözdizimi Kontrolü (Syntax Check)
        run: |
          python3 -m py_compile main.py
          python3 -m py_compile $(find voltapp -name "*.py")

      - name: Birim Testleri Çalıştır (Unittest via Xvfb)
        run: |
          xvfb-run -a python3 -m unittest discover -s tests -v

      - name: Debian (.deb) Paketini Derle ve Doğrula
        run: |
          bash packaging/build_deb.sh
          dpkg -I packaging/voltapp_1.0.0_all.deb

