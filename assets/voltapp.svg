<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Arka Plan Gradyanı -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e2e"/>
      <stop offset="100%" stop-color="#11111b"/>
    </linearGradient>

    <!-- Elektrik Sarı Gradyanı -->
    <linearGradient id="pikaGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE600"/>
      <stop offset="60%" stop-color="#FFC700"/>
      <stop offset="100%" stop-color="#FFA000"/>
    </linearGradient>

    <!-- Kulak Ucu Siyah Gradyan -->
    <linearGradient id="earTipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D2B35"/>
      <stop offset="100%" stop-color="#16151A"/>
    </linearGradient>

    <!-- Yanak / Vurgu Kırmızı Gradyan -->
    <linearGradient id="cheekRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5252"/>
      <stop offset="100%" stop-color="#E53935"/>
    </linearGradient>

    <!-- Şimşek Parlama Efekti -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Konteyner (App Icon Arka Planı) -->
  <rect x="16" y="16" width="224" height="224" rx="56" fill="url(#bgGrad)" stroke="#313244" stroke-width="3"/>

  <!-- Kulaklar (Pikachu Esintili Kulaklar) -->
  <!-- Sol Kulak -->
  <g transform="rotate(-28 85 95)">
    <!-- Kulak Sarı Gövde -->
    <path d="M 75 95 Q 65 45 80 20 Q 95 45 92 95 Z" fill="url(#pikaGold)"/>
    <!-- Sol Kulak Ucu -->
    <path d="M 75 42 Q 68 28 80 20 Q 92 28 87 42 Z" fill="url(#earTipGrad)"/>
  </g>

  <!-- Sağ Kulak -->
  <g transform="rotate(28 171 95)">
    <!-- Kulak Sarı Gövde -->
    <path d="M 164 95 Q 161 45 176 20 Q 191 45 181 95 Z" fill="url(#pikaGold)"/>
    <!-- Sağ Kulak Ucu -->
    <path d="M 169 42 Q 164 28 176 20 Q 188 28 181 42 Z" fill="url(#earTipGrad)"/>
  </g>

  <!-- Yüz / Ana Gövde Dairesi -->
  <circle cx="128" cy="144" r="68" fill="url(#pikaGold)"/>

  <!-- Yanaklar (Elektrik Depolayan Kırmızı Daireler) -->
  <ellipse cx="80" cy="158" rx="14" ry="11" fill="url(#cheekRed)" opacity="0.9"/>
  <ellipse cx="176" cy="158" rx="14" ry="11" fill="url(#cheekRed)" opacity="0.9"/>

  <!-- Gözler (Büyük, Sevimli Anime/Pikachu Gözleri) -->
  <ellipse cx="98" cy="132" rx="9" ry="12" fill="#181825"/>
  <ellipse cx="158" cy="132" rx="9" ry="12" fill="#181825"/>
  <!-- Göz Parıltıları -->
  <circle cx="95" cy="128" r="3.5" fill="#FFFFFF"/>
  <circle cx="155" cy="128" r="3.5" fill="#FFFFFF"/>
  <circle cx="101" cy="136" r="1.5" fill="#FFFFFF"/>
  <circle cx="161" cy="136" r="1.5" fill="#FFFFFF"/>

  <!-- Sevimli Burun -->
  <polygon points="128,142 125,145 131,145" fill="#181825"/>

  <!-- Sevimli Ağız (Kedi/Pika tarzı gülümseme) -->
  <path d="M 120 150 Q 124 155 128 152 Q 132 155 136 150" fill="none" stroke="#181825" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Göğüste / Ortada Dinamik Şimşek Rozeti (VoltApp Simgesi) -->
  <g filter="url(#glow)">
    <polygon points="128,162 114,188 126,188 120,208 142,178 130,178 136,162" fill="#FFFFFF" stroke="#FFE600" stroke-width="2" stroke-linejoin="round"/>
  </g>
</svg>
